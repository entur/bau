# The app is served from GitHub Pages (see pages.yml). Firebase Hosting only
# carries a notice pointing to the new address until the old URL is retired.
#
# Run by hand, once geocoder-tester.entur.io is live, so the notice never
# points at an address that does not resolve yet.

name: Deploy moved notice to Firebase Hosting
on:
  workflow_dispatch:

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    environment: "dev"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENT_BAU_DEV }}"
          channelId: live
          projectId: ent-bau-dev
          # 15.34.1 needs serviceusage.services.get, which the deploy
          # service account lacks.
          firebaseToolsVersion: 15.34.0
