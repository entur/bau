# The app is served from GitHub Pages (see pages.yml). Firebase Hosting only
# carries a notice pointing to the new address until the old URL is retired.
#
# Run by hand, once geocoder-tester.entur.io is live, so the notice never
# points at an address that does not resolve yet.

name: Deploy moved notice to Firebase Hosting
on:
  workflow_dispatch:

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    environment: "dev"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENT_BAU_DEV }}"
          channelId: live
          projectId: ent-bau-dev
