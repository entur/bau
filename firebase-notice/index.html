<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Geocoder tester has moved</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #181c56;
        --muted: #4d4f6b;
        --link: #181c56;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181c56;
          --fg: #ffffff;
          --muted: #cfd0e0;
          --link: #ff5959;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 36rem;
        padding: 0 16px;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--link);
        font-weight: 600;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Geocoder tester has moved</h1>
      <p>This address is no longer updated. The app now lives at:</p>
      <p>
        <a id="new-url" href="https://geocoder-tester.entur.io/"
          >https://geocoder-tester.entur.io/</a
        >
      </p>
      <p>Please update your bookmarks.</p>
    </main>
    <script>
      // Carry the query over so shared links keep it; no redirect.
      if (location.search || location.hash) {
        const a = document.getElementById("new-url");
        a.href =
          "https://geocoder-tester.entur.io/" + location.search + location.hash;
        a.textContent = a.href;
      }
    </script>
  </body>
</html>
